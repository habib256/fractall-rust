name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build + tests (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies (GMP / MPFR / MPC)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu
          # `.cargo/config.toml` utilise target-cpu=native : réutiliser target/
          # depuis un runner au CPU différent peut provoquer SIGILL.
          cache-targets: "false"

      # Les tests unitaires des modules appartiennent à la cible `lib` depuis
      # l'extraction de `src/lib.rs` : UNE exécution au lieu de la même suite
      # rejouée par chaque binaire.
      - name: Unit tests (lib — moteur, quality, gui)
        run: cargo test --release --locked --lib

      - name: Golden image tests
        run: cargo test --release --locked --test golden_images
